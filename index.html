<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Mesto</title>
    <link rel="icon" href="./src/images/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/pages/index.css" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          src="./src/images/logo.svg"
          alt="Логотип проекта место"
          class="logo header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <button
            type="button"
            class="profile__image"
            aria-label="Обновить аватар"
          ></button>
          <div class="profile__info">
            <h1 class="profile__title">Жак-Ив Кусто</h1>
            <button
              class="profile__edit-button"
              type="button"
              aria-label="Редактировать профиль"
            ></button>
            <p class="profile__description">Исследователь океана</p>
          </div>
          <button
            class="profile__add-button"
            type="button"
            aria-label="Добавить место"
          ></button>
        </section>
        <section class="places page__section">
          <ul class="places__list" id="places-list"></ul>
          <button
            class="places__more-button"
            type="button"
            aria-controls="places-list"
            hidden
          >
            Показать ещё
          </button>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2026 Mesto Russia</p>
      </footer>

      <div
        class="popup popup_type_edit"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-title"
      >
        <div class="popup__content">
          <button
            type="button"
            class="popup__close"
            aria-label="Закрыть"
          ></button>
          <h3 class="popup__title" id="profile-title">Редактировать профиль</h3>
          <form class="popup__form" name="edit-profile" novalidate>
            <label class="popup__label">
              <input
                type="text"
                name="user-name"
                id="user-name"
                class="popup__input popup__input_type_name"
                placeholder="Имя"
                aria-label="Имя"
                aria-describedby="user-name-error"
                required
                minlength="2"
                maxlength="40"
                pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$"
                data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
              />
              <span
                class="popup__error"
                id="user-name-error"
                aria-live="polite"
              ></span>
            </label>
            <label class="popup__label">
              <input
                type="text"
                name="user-description"
                id="user-description"
                class="popup__input popup__input_type_description"
                placeholder="Занятие"
                aria-label="Занятие"
                aria-describedby="user-description-error"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                class="popup__error"
                id="user-description-error"
                aria-live="polite"
              ></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
          </form>
        </div>
      </div>

      <div
        class="popup popup_type_new-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="place-title"
      >
        <div class="popup__content">
          <button
            type="button"
            class="popup__close"
            aria-label="Закрыть"
          ></button>
          <h3 class="popup__title" id="place-title">Новое место</h3>
          <form class="popup__form" name="new-place" novalidate>
            <label class="popup__label">
              <input
                type="text"
                name="place-name"
                id="place-name"
                class="popup__input popup__input_type_card-name"
                placeholder="Название"
                aria-label="Название"
                aria-describedby="place-name-error"
                required
                minlength="2"
                maxlength="30"
                pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$"
                data-error-message="Разрешены только латинские, кириллические буквы, знаки дефиса и пробелы"
              />
              <span
                class="popup__error"
                id="place-name-error"
                aria-live="polite"
              ></span>
            </label>
            <label class="popup__label">
              <input
                type="url"
                name="place-link"
                id="place-link"
                class="popup__input popup__input_type_url"
                placeholder="Ссылка на картинку"
                aria-label="Ссылка на картинку"
                aria-describedby="place-link-error"
                required
              />
              <span
                class="popup__error"
                id="place-link-error"
                aria-live="polite"
              ></span>
            </label>
            <label class="popup__label">
              <input
                type="text"
                name="place-priority"
                id="place-priority"
                class="popup__input popup__input_type_priority"
                placeholder="Приоритет показа (от 1 до 10)"
                aria-label="Приоритет показа"
                aria-describedby="place-priority-error"
                inputmode="numeric"
                pattern="^([1-9]|10)$"
                data-error-message="Число от 1 до 10"
                required
              />
              <span
                class="popup__error"
                id="place-priority-error"
                aria-live="polite"
              ></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Создать
            </button>
          </form>
        </div>
      </div>

      <div
        class="popup popup_type_image"
        role="dialog"
        aria-modal="true"
        aria-labelledby="image-caption"
      >
        <div class="popup__content popup__content_content_image">
          <button
            type="button"
            class="popup__close"
            aria-label="Закрыть"
          ></button>
          <img alt="" class="popup__image" />
          <p class="popup__caption" id="image-caption"></p>
        </div>
      </div>

      <div
        class="popup popup_type_edit-avatar"
        role="dialog"
        aria-modal="true"
        aria-labelledby="avatar-title"
      >
        <div class="popup__content">
          <button
            type="button"
            class="popup__close"
            aria-label="Закрыть"
          ></button>
          <h3 class="popup__title" id="avatar-title">Обновить аватар</h3>
          <form class="popup__form" name="edit-avatar" novalidate>
            <label class="popup__label">
              <input
                type="url"
                name="user-avatar"
                id="user-avatar"
                class="popup__input popup__input_type_url popup__input_type_avatar"
                placeholder="Ссылка на изображение"
                aria-label="Ссылка на изображение"
                aria-describedby="user-avatar-error"
                required
              />
              <span
                class="popup__error"
                id="user-avatar-error"
                aria-live="polite"
              ></span>
            </label>
            <button
              type="submit"
              class="button popup__button popup__button_disabled"
              disabled
            >
              Сохранить
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="./src/scripts/index.js" type="module"></script>

    <template id="card-template">
      <li class="places__item card">
        <img class="card__image" alt="" tabindex="0" role="button" />
        <div class="card__control">
          <button
            type="button"
            class="card__control-button card__control-button_type_delete"
            aria-label="Удалить карточку"
          ></button>
        </div>
        <div class="card__description">
          <div class="card__info">
            <h2 class="card__title"></h2>
            <p class="card__priority"></p>
          </div>
          <div class="card__likes">
            <button
              type="button"
              class="card__like-button"
              aria-label="Нравится"
              aria-pressed="false"
            ></button>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
